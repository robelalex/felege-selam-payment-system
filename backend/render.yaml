services:
  - type: web
    name: felege-selam-backend
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      python manage.py collectstatic --noinput
    startCommand: gunicorn core.wsgi:application --timeout 180 --workers 1 --bind 0.0.0.0:10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: felege-selam-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: GUNICORN_TIMEOUT
        value: 180
      - key: WEB_CONCURRENCY
        value: 1

  # Item 4: daily SMS reminders for deadlines due in 5 days / 1 day.
  # Runs at 05:30 UTC (~08:30 Addis Ababa) so it lands early in the
  # school day rather than overnight.
  - type: cron
    name: felege-selam-scheduled-reminders
    runtime: python
    schedule: "30 5 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py send_scheduled_reminders
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: felege-selam-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1

databases:
  - name: felege-selam-db
    databaseName: felege_selam
    user: felege_user